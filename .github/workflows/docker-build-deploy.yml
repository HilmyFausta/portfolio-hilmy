name: Build & Push Portfolio Image

# Jalan otomatis tiap ada push ke branch main.
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python (buat bundle.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle CSS+JS jadi inline (fix masalah Load Balancer)
        run: python3 bundle.py

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-hilmy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-hilmy:${{ github.sha }}